name: Linux platform tests

on:
  push:
    branches:
      - master
      - feature/linux-native-build
  pull_request:
  workflow_dispatch:

jobs:
  platform-tests:
    name: Linux platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run platform tests
        run: node --test
