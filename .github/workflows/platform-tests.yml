name: Linux platform tests and AppImage

on:
  push:
    branches:
      - master
      - feature/linux-native-build
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Tests and Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run platform tests
        run: npm test
      - name: Smoke test Electron UI and backup flow
        run: xvfb-run -a npm run smoke:linux
      - name: Build AppImage
        run: npm run dist:linux
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: dark-souls-save-manager-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
